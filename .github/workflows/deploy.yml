# Flujo oficial de Astro para GitHub Pages
# https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  # Se publica cada vez que haces push a la rama main
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # Detecta pnpm por el archivo pnpm-lock.yaml (¡debe estar en el repositorio!)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
